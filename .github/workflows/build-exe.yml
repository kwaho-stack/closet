name: Build Windows exe

on:
  push:
    branches: [main]
    paths: [app/**]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name ShutdownTimer app/shutdown_timer.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShutdownTimer
          path: dist/ShutdownTimer.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShutdownTimer.exe
